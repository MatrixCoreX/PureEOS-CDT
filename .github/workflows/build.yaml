name: AIC CDT SDK source checks

on:
  push:
    branches: [main, develop, "feature/**", "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aic-cdt-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-source:
    name: SDK source checks (Ubuntu ${{ matrix.ubuntu }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["26.04", "26.10"]
    container: ubuntu:${{ matrix.ubuntu }}
    steps:
      - name: Install source-check prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ cmake python3 python3-yaml git ca-certificates
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
      - name: Run actual SDK native and sanitizer regressions
        run: |
          python3 -B tests/hardening/run_native_tests.py --output ci-results/sdk-native
      - name: Preserve scoped source-check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aic-cdt-sdk-source-ubuntu-${{ matrix.ubuntu }}
          path: ci-results/sdk-native/
          retention-days: 7
